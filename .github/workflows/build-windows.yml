name: Compilar EXE Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Compilar EXE
        run: pyinstaller --clean JovellanosHistoriaHispanica.spec
      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: Jovellanos_Historia_Hispanica_Windows
          path: dist/Jovellanos_Historia_Hispanica.exe
          if-no-files-found: error
